spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ── USER SERVICE — rutas públicas ─────────
            - id: user-register
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/user/register
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            - id: user-auth
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            # ── USER SERVICE — rutas protegidas ───────
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/user/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            # ── PET SERVICE — rutas protegidas ────────
            - id: pet-service
              uri: ${PET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/pets/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: pet-service
                    fallbackUri: forward:/fallback/pet

            # ── VETERINARY SERVICE — rutas protegidas ─
            # Sin RewritePath: a diferencia de User/Pets, Veterinary expone sus
            # controllers en /api/veterinary/** (con el prefijo /api incluido),
            # así que el gateway debe reenviar la ruta tal cual.
            - id: veterinary-service
              uri: ${VETERINARY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/veterinary/**
              filters:
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: veterinary-service
                    fallbackUri: forward:/fallback/veterinary

            # ── MEDICAL PET SERVICE — rutas protegidas ─
            - id: medical-pet-service
              uri: ${MEDICAL_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/visits/**, /api/weight/**, /api/treatments/**, /api/lab/**, /api/medications/**, /api/surgery/**, /api/vaccines/**, /api/allergies/**, /api/dewormings/**, /api/documents/**
              filters:
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: medical-pet-service
                    fallbackUri: forward:/fallback/medical

            # ── CALENDAR SERVICE — rutas protegidas ───
            # CALENDAR_SERVICE_URL es solo el host (sin /api al final): Calendar
            # sirve sus rutas bajo /api, por eso no hay RewritePath aquí.
            # /internal/jobs/appointments/reminders (Cloud Scheduler) NO se
            # enruta a propósito: no debe quedar accesible desde fuera.
            - id: calendar-service
              uri: ${CALENDAR_SERVICE_URL:http://localhost:3001}
              predicates:
                - Path=/api/calendar-events/**, /api/veterinaries/**, /api/me/appointments/**
              filters:
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: calendar-service
                    fallbackUri: forward:/fallback/calendar

            # ── NOTIFICATION SERVICE — rutas protegidas ─
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:3002}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notification

            # ── IA SERVICE — rutas protegidas ─────────
            # Sin RewritePath: igual que Veterinary, el ai-service expone
            # sus controllers en /api/ai/** con el prefijo incluido.
            # NO se enruta /api/ai/internal/** (ni nada bajo /internal): esa
            # parte es servicio a servicio (Veterinary la llama con una API
            # key interna) y no debe quedar accesible desde fuera.
            - id: ia-service
              uri: ${IA_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/ai/**
              filters:
                # 1/3 en vez de 20/40: cada turno de chat gasta 2-3 llamadas a
                # Gemini y el free tier es ~20/min. Con el límite estándar por
                # usuario, un solo cliente agota la cuota diaria del servicio.
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: ia-service
                    fallbackUri: forward:/fallback/ia

            # ── FALLBACK ──────────────────────────────
            - id: fallback-user
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/user
              filters: []

            - id: fallback-pet
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/pet
              filters: []

            - id: fallback-veterinary
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/veterinary
              filters: []

            - id: fallback-medical
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/medical
              filters: []

            - id: fallback-calendar
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/calendar
              filters: []

            - id: fallback-notification
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/notification
              filters: [ ]

            - id: fallback-ia
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/ia
              filters: []

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      pet-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      veterinary-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      medical-pet-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      calendar-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      notification-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      ia-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        # 70 en vez de 50: Gemini devuelve 503 en ráfagas por saturación.
        # Con 50 el circuito se abre seguido y corta todo el asistente por
        # un problema transitorio de un tercero.
        failure-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      user-service:
        timeout-duration: 5s
      pet-service:
        timeout-duration: 5s
      veterinary-service:
        # 30s: Cloud Run cold start (~20s) plus document uploads to Storage.
        timeout-duration: 30s
      medical-pet-service:
        timeout-duration: 5s
      calendar-service:
        timeout-duration: 5s
      notification-service:
        timeout-duration: 5s
      ia-service:
        # 70s: el chat puede tardar ~40s en el peor caso (reintentos de
        # Gemini + fallback de modelo) y el análisis de documentos de
        # verificación hasta 50s. Con 5s se corta aunque el servicio
        # responda bien.
        timeout-duration: 70s

server:
  port: ${PORT:8090}

# Comma-separated list of allowed CORS origins. Falls back to the legacy
# single-origin FRONTEND_URL if FRONTEND_URLS isn't set. See CorsConfig.
frontend:
  urls: ${FRONTEND_URLS:${FRONTEND_URL:http://localhost:8100,http://localhost:4200}}

jwt:
  secret: ${JWT_SECRET:}
  jwks-uri: ${JWT_JWKS_URI}
  issuer: ${JWT_ISSUER:myanimalog-user-service}
  audience: ${JWT_AUDIENCE:myanimalog-api}
  accept-legacy: ${JWT_ACCEPT_LEGACY:true}

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never