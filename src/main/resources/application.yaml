spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${FRONTEND_URL:http://localhost:8100}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # ── USER SERVICE — rutas públicas ─────────
            - id: user-register
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/user/register
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            - id: user-auth
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            # ── USER SERVICE — rutas protegidas ───────
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/user/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            # ── PET SERVICE — rutas protegidas ────────
            - id: pet-service
              uri: ${PET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/pets/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: pet-service
                    fallbackUri: forward:/fallback/pet

            # ── VETERINARY SERVICE — rutas protegidas ─
            - id: veterinary-service
              uri: ${VETERINARY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/veterinary/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: veterinary-service
                    fallbackUri: forward:/fallback/veterinary

            # ── MEDICAL PET SERVICE — rutas protegidas ─
            - id: medical-pet-service
              uri: ${MEDICAL_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/visits/**, /api/weight/**, /api/treatments/**, /api/lab/**, /api/medications/**, /api/surgery/**, /api/vaccines/**
              filters:
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: medical-pet-service
                    fallbackUri: forward:/fallback/medical

            # ── CALENDAR SERVICE — rutas protegidas ───
            - id: calendar-service
              uri: ${CALENDAR_SERVICE_URL:http://localhost:3001}
              predicates:
                - Path=/api/calendar-events/**
              filters:
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: calendar-service
                    fallbackUri: forward:/fallback/calendar

            # ── FALLBACK ──────────────────────────────
            - id: fallback-user
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/user
              filters: []

            - id: fallback-pet
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/pet
              filters: []

            - id: fallback-veterinary
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/veterinary
              filters: []

            - id: fallback-medical
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/medical
              filters: []

            - id: fallback-calendar
              uri: http://localhost:${PORT:8090}
              predicates:
                - Path=/fallback/calendar
              filters: []

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      pet-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      veterinary-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      medical-pet-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      calendar-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      user-service:
        timeout-duration: 5s
      pet-service:
        timeout-duration: 5s
      veterinary-service:
        timeout-duration: 5s
      medical-pet-service:
        timeout-duration: 5s
      calendar-service:
        timeout-duration: 5s

server:
  port: ${PORT:8090}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never