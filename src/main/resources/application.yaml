spring:
  application:
    name: api-gateway

  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:8100"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            # ── USER SERVICE — rutas públicas ─────────
            - id: user-register
              uri: lb://user-service
              predicates:
                - Path=/api/user/register
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            - id: user-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            # ── USER SERVICE — rutas protegidas ───────
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user

            # ── PET SERVICE — rutas protegidas ────────
            - id: pet-service
              uri: lb://pet-service
              predicates:
                - Path=/api/pets/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: pet-service
                    fallbackUri: forward:/fallback/pet

            # ── VETERINARY SERVICE — rutas protegidas ─
            - id: veterinary-service
              uri: lb://veterinary-service
              predicates:
                - Path=/api/veterinary/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: veterinary-service
                    fallbackUri: forward:/fallback/veterinary

            # ── 🆕 MEDICAL PET SERVICE — rutas protegidas ─
            - id: medical-pet-service
              uri: lb://medical-pet-service
              predicates:
                # 👇 ACTUALIZADO: Captura absolutamente todas las sub-rutas de tu servicio de Node.js
                - Path=/api/visits/**, /api/weight/**, /api/treatments/**, /api/lab/**, /api/medications/**, /api/surgery/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment} # Convierte /api/medications/xyz en /medications/xyz
                - name: JwtAuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: medical-pet-service
                    fallbackUri: forward:/fallback/medical

                # ── FALLBACK ──────────────────────────────
            - id: fallback-user
              uri: http://localhost:8090
              predicates:
                - Path=/fallback/user
              filters: []

            - id: fallback-pet
              uri: http://localhost:8090
              predicates:
                - Path=/fallback/pet
              filters: []

            - id: fallback-veterinary
              uri: http://localhost:8090
              predicates:
                - Path=/fallback/veterinary
              filters: []

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      pet-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      veterinary-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      user-service:
        timeout-duration: 5s
      pet-service:
        timeout-duration: 5s
      veterinary-service:
        timeout-duration: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: ${SERVER_PORT:8090}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans